spring.application.name=psicoapp
spring.datasource.url=${PSICOAPP_DB_URL:jdbc:mysql://localhost:3306/psicoapp}
spring.datasource.username=${PSICOAPP_DB_USER:psicoapp}
spring.datasource.password=${PSICOAPP_DB_PASSWORD:}
spring.sql.init.mode=always
psicoapp.identity.institutional-domains=${PSICOAPP_INSTITUTIONAL_DOMAINS:}
psicoapp.identity.admin-email=${PSICOAPP_ADMIN_EMAIL:}
psicoapp.identity.admin-password=${PSICOAPP_ADMIN_PASSWORD:}

spring.application.name=psicoapp
spring.datasource.url=${PSICOAPP_BD_URL:jdbc:mysql://localhost:3306/psicoapp?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${PSICOAPP_BD_USUARIO:psicoapp}
spring.datasource.password=${PSICOAPP_BD_CLAVE:}
spring.sql.init.mode=always
psicoapp.identidad.dominios-institucionales=${PSICOAPP_DOMINIOS_INSTITUCIONALES:}
psicoapp.identidad.correo-administrador=${PSICOAPP_CORREO_ADMINISTRADOR:}
psicoapp.identidad.clave-administrador=${PSICOAPP_CLAVE_ADMINISTRADOR:}
psicoapp.participacion.cierre-automatico-habilitado=${PSICOAPP_PARTICIPACION_CIERRE_AUTOMATICO:true}
psicoapp.participacion.intervalo-cierre-ms=${PSICOAPP_PARTICIPACION_INTERVALO_CIERRE_MS:60000}

psicoapp.notificaciones.clave-cifrado=${PSICOAPP_NOTIFICACIONES_CLAVE_CIFRADO:}
psicoapp.notificaciones.url-acceso=${PSICOAPP_NOTIFICACIONES_URL_ACCESO:http://localhost:3000/ingreso}
psicoapp.notificaciones.remitente=${PSICOAPP_NOTIFICACIONES_REMITENTE:}
psicoapp.notificaciones.despacho-habilitado=${PSICOAPP_NOTIFICACIONES_DESPACHO:true}
psicoapp.notificaciones.intervalo-ms=${PSICOAPP_NOTIFICACIONES_INTERVALO_MS:30000}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.host=${PSICOAPP_CORREO_HOST:localhost}
spring.mail.port=${PSICOAPP_CORREO_PUERTO:587}
spring.mail.username=${PSICOAPP_CORREO_USUARIO:}
spring.mail.password=${PSICOAPP_CORREO_CLAVE:}
spring.mail.properties.mail.smtp.auth=${PSICOAPP_CORREO_AUTENTICACION:true}
spring.mail.properties.mail.smtp.starttls.enable=${PSICOAPP_CORREO_TLS:true}
spring.mail.properties.mail.smtp.starttls.required=${PSICOAPP_CORREO_TLS:true}

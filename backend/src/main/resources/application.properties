# Carga el .env de la raíz al ejecutar desde backend/ o desde la raíz del repositorio.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

spring.application.name=${PSICOAPP_NOMBRE_APLICACION}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.datasource.url=${PSICOAPP_BD_URL}
spring.datasource.username=${PSICOAPP_BD_USUARIO}
spring.datasource.password=${PSICOAPP_BD_CLAVE}
spring.sql.init.mode=${PSICOAPP_SQL_INICIALIZACION}
psicoapp.identidad.dominios-institucionales=${PSICOAPP_DOMINIOS_INSTITUCIONALES}
psicoapp.identidad.correo-administrador=${PSICOAPP_CORREO_ADMINISTRADOR}
psicoapp.identidad.clave-administrador=${PSICOAPP_CLAVE_ADMINISTRADOR}
psicoapp.identidad.jwt.clave=${PSICOAPP_JWT_CLAVE}
psicoapp.identidad.jwt.duracion-segundos=${PSICOAPP_JWT_DURACION_SEGUNDOS}
psicoapp.identidad.jwt.clave-requerida=${PSICOAPP_JWT_CLAVE_REQUERIDA}
psicoapp.web.origenes-permitidos=${PSICOAPP_CORS_ORIGENES:}
psicoapp.participacion.cierre-automatico-habilitado=${PSICOAPP_PARTICIPACION_CIERRE_AUTOMATICO}
psicoapp.participacion.intervalo-cierre-ms=${PSICOAPP_PARTICIPACION_INTERVALO_CIERRE_MS}
psicoapp.sesiones.intervalo-cierre-ms=${PSICOAPP_SESIONES_INTERVALO_CIERRE_MS}
psicoapp.notificaciones.clave-cifrado=${PSICOAPP_NOTIFICACIONES_CLAVE_CIFRADO}
psicoapp.notificaciones.url-acceso=${PSICOAPP_NOTIFICACIONES_URL_ACCESO}
psicoapp.notificaciones.remitente=${PSICOAPP_NOTIFICACIONES_REMITENTE:}
psicoapp.notificaciones.gmail.id-cliente=${PSICOAPP_GMAIL_ID_CLIENTE:}
psicoapp.notificaciones.gmail.secreto-cliente=${PSICOAPP_GMAIL_SECRETO_CLIENTE:}
psicoapp.notificaciones.gmail.token-renovacion=${PSICOAPP_GMAIL_TOKEN_RENOVACION:}
psicoapp.notificaciones.despacho-habilitado=${PSICOAPP_NOTIFICACIONES_DESPACHO:false}
psicoapp.notificaciones.intervalo-ms=${PSICOAPP_NOTIFICACIONES_INTERVALO_MS}
psicoapp.notificaciones.avisos-docente-habilitados=${PSICOAPP_NOTIFICACIONES_AVISOS_DOCENTE:true}
psicoapp.notificaciones.recordatorio-horas=${PSICOAPP_NOTIFICACIONES_RECORDATORIO_HORAS:24}
psicoapp.notificaciones.avisos-docente-intervalo-ms=${PSICOAPP_NOTIFICACIONES_AVISOS_DOCENTE_INTERVALO_MS:60000}
psicoapp.notificaciones.avisos-docente-demora-inicial-ms=${PSICOAPP_NOTIFICACIONES_AVISOS_DOCENTE_DEMORA_INICIAL_MS:1000}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

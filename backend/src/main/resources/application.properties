spring.application.name=psicoapp
spring.datasource.url=${PSICOAPP_BD_URL:jdbc:mysql://localhost:3306/psicoapp?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${PSICOAPP_BD_USUARIO:psicoapp}
spring.datasource.password=${PSICOAPP_BD_CLAVE:}
spring.sql.init.mode=always
psicoapp.identidad.dominios-institucionales=${PSICOAPP_DOMINIOS_INSTITUCIONALES:}
psicoapp.identidad.correo-administrador=${PSICOAPP_CORREO_ADMINISTRADOR:}
psicoapp.identidad.clave-administrador=${PSICOAPP_CLAVE_ADMINISTRADOR:}
psicoapp.participacion.cierre-automatico-habilitado=${PSICOAPP_PARTICIPACION_CIERRE_AUTOMATICO:true}
psicoapp.participacion.intervalo-cierre-ms=${PSICOAPP_PARTICIPACION_INTERVALO_CIERRE_MS:60000}

name: psicoapp

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: psicoapp
      MYSQL_USER: ${PSICOAPP_DOCKER_BD_USUARIO:-psicoapp}
      MYSQL_PASSWORD: ${PSICOAPP_DOCKER_BD_CLAVE:-psicoapp_local}
      MYSQL_ROOT_PASSWORD: ${PSICOAPP_DOCKER_MYSQL_ROOT_CLAVE:-psicoapp_root_local}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - psicoapp_mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: psicoapp-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 127.0.0.1:${PSICOAPP_BACKEND_PUERTO:-8080}:8080
    environment:
      PSICOAPP_NOMBRE_APLICACION: ${PSICOAPP_NOMBRE_APLICACION:-psicoapp}
      PSICOAPP_BD_URL: jdbc:mysql://mysql:3306/psicoapp?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      PSICOAPP_BD_USUARIO: ${PSICOAPP_DOCKER_BD_USUARIO:-psicoapp}
      PSICOAPP_BD_CLAVE: ${PSICOAPP_DOCKER_BD_CLAVE:-psicoapp_local}
      PSICOAPP_SQL_INICIALIZACION: ${PSICOAPP_SQL_INICIALIZACION:-always}
      PSICOAPP_DOMINIOS_INSTITUCIONALES: ${PSICOAPP_DOMINIOS_INSTITUCIONALES:-universidad.edu.co}
      PSICOAPP_CORREO_ADMINISTRADOR: ${PSICOAPP_CORREO_ADMINISTRADOR:-}
      PSICOAPP_CLAVE_ADMINISTRADOR: ${PSICOAPP_CLAVE_ADMINISTRADOR:-}
      PSICOAPP_JWT_CLAVE: ${PSICOAPP_JWT_CLAVE:-}
      PSICOAPP_JWT_DURACION_SEGUNDOS: ${PSICOAPP_JWT_DURACION_SEGUNDOS:-900}
      PSICOAPP_JWT_CLAVE_REQUERIDA: ${PSICOAPP_JWT_CLAVE_REQUERIDA:-false}
      PSICOAPP_PARTICIPACION_CIERRE_AUTOMATICO: ${PSICOAPP_PARTICIPACION_CIERRE_AUTOMATICO:-true}
      PSICOAPP_PARTICIPACION_INTERVALO_CIERRE_MS: ${PSICOAPP_PARTICIPACION_INTERVALO_CIERRE_MS:-60000}
      PSICOAPP_SESIONES_INTERVALO_CIERRE_MS: ${PSICOAPP_SESIONES_INTERVALO_CIERRE_MS:-60000}
      PSICOAPP_NOTIFICACIONES_CLAVE_CIFRADO: ${PSICOAPP_NOTIFICACIONES_CLAVE_CIFRADO:-}
      PSICOAPP_NOTIFICACIONES_URL_ACCESO: ${PSICOAPP_NOTIFICACIONES_URL_ACCESO:-http://localhost:3000/ingreso}
      PSICOAPP_NOTIFICACIONES_REMITENTE: ${PSICOAPP_NOTIFICACIONES_REMITENTE:-}
      PSICOAPP_GMAIL_ID_CLIENTE: ${PSICOAPP_GMAIL_ID_CLIENTE:-}
      PSICOAPP_GMAIL_SECRETO_CLIENTE: ${PSICOAPP_GMAIL_SECRETO_CLIENTE:-}
      PSICOAPP_GMAIL_TOKEN_RENOVACION: ${PSICOAPP_GMAIL_TOKEN_RENOVACION:-}
      PSICOAPP_NOTIFICACIONES_DESPACHO: ${PSICOAPP_NOTIFICACIONES_DESPACHO:-false}
      PSICOAPP_NOTIFICACIONES_INTERVALO_MS: ${PSICOAPP_NOTIFICACIONES_INTERVALO_MS:-30000}

volumes:
  psicoapp_mysql:
